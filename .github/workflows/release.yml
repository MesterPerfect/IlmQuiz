name: IlmQuiz Build and Release Pipeline

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.0)'
        required: false
        default: ''
      release_name:
        description: 'Release title (e.g. IlmQuiz v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Extract App Version
        id: version
        shell: bash
        run: |
          # Extract version and strictly remove Windows carriage returns (\r)
          VERSION=$(python -c "import sys; sys.path.append('.'); from core.constants import APP_VERSION; print(APP_VERSION.strip())" | tr -d '\r')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Upgrade pip and install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cx_Freeze packaging

      - name: Build with cx_Freeze
        shell: bash
        run: |
          python setup.py build

      # ==========================================
      # WINDOWS: Installer (.exe) & Portable (.zip)
      # ==========================================
      - name: Build Windows Installer (Inno Setup)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Compile the Inno Setup script to generate the .exe installer
          iscc ilmquiz_setup.iss

      - name: Create Windows Portable (ZIP)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Package the build output into a clean ZIP file with version name
          New-Item -ItemType Directory -Path "portable_output\IlmQuiz" -Force | Out-Null
          Copy-Item -Path "dist\IlmQuiz\*" -Destination "portable_output\IlmQuiz" -Recurse -Force
          Compress-Archive -Path "portable_output\IlmQuiz" -DestinationPath "IlmQuiz_Windows_Portable_v${{ env.APP_VERSION }}.zip"

      # ==========================================
      # MACOS: Installer (.dmg) & Portable (.zip)
      # ==========================================
      - name: Build macOS Installer (DMG)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          # Create a macOS disk image for standard drag-and-drop installation
          hdiutil create -volname "IlmQuiz" -srcfolder dist/IlmQuiz -ov -format UDZO IlmQuiz_macOS_Installer_v${{ env.APP_VERSION }}.dmg

      - name: Create macOS Portable (ZIP)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          # Create a standard ZIP archive for portable use
          cd dist
          zip -r ../IlmQuiz_macOS_Portable_v${{ env.APP_VERSION }}.zip IlmQuiz/

      # ==========================================
      # LINUX: Installer (.deb) & Portable (.tar.gz)
      # ==========================================
      - name: Build Linux Installer (DEB)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # Create strict directory structure
          mkdir -p deb_package/opt/IlmQuiz
          mkdir -p deb_package/usr/bin
          mkdir -p deb_package/usr/share/applications
          mkdir -p deb_package/DEBIAN
          
          # Copy app files
          cp -r dist/IlmQuiz/* deb_package/opt/IlmQuiz/
          chmod +x deb_package/opt/IlmQuiz/IlmQuiz
          
          # Create executable symlink wrapper (Using 'EOF' to prevent variable expansion)
          cat <<'EOF' > deb_package/usr/bin/ilmquiz
          #!/bin/bash
          /opt/IlmQuiz/IlmQuiz "$@"
          EOF
          chmod +x deb_package/usr/bin/ilmquiz
          
          # Create Desktop Entry for app menu
          cat <<'EOF' > deb_package/usr/share/applications/ilmquiz.desktop
          [Desktop Entry]
          Name=IlmQuiz
          Comment=Islamic Knowledge Challenge
          Exec=/opt/IlmQuiz/IlmQuiz
          Terminal=false
          Type=Application
          Categories=Education;Game;
          EOF
          
          # Create DEBIAN control file (Requires an empty line at the end)
          cat <<EOF > deb_package/DEBIAN/control
          Package: ilmquiz
          Version: ${{ env.APP_VERSION }}
          Section: games
          Priority: optional
          Architecture: amd64
          Maintainer: MesterPerfect
          Description: IlmQuiz - Islamic Knowledge Challenge
          
          EOF
          
          # Build the .deb file safely
          dpkg-deb --build deb_package IlmQuiz_Linux_Installer_v${{ env.APP_VERSION }}.deb

      - name: Create Linux Portable (TAR.GZ)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # Compress the build output into a tarball for Linux portable use
          cd dist
          tar -czvf ../IlmQuiz_Linux_Portable_v${{ env.APP_VERSION }}.tar.gz IlmQuiz/

      # ==========================================
      # UPLOAD ARTIFACTS
      # ==========================================
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            IlmQuiz_*.zip
            IlmQuiz_*.dmg
            IlmQuiz_*.tar.gz
            IlmQuiz_*.deb
            build_installer/*.exe

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true


      - name: Extract Version, Info & Release Notes
        id: release_info
        run: |
          # 1. استخراج رقم الإصدار
          export APP_VERSION=$(python -c "import sys; sys.path.append('.'); from core.constants import APP_VERSION; print(APP_VERSION.strip())" | tr -d '\r')
          
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "TAG_NAME=${{ github.event.inputs.tag_name }}" >> $GITHUB_ENV
            echo "RELEASE_NAME=${{ github.event.inputs.release_name }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=v${APP_VERSION}" >> $GITHUB_ENV
            echo "RELEASE_NAME=IlmQuiz v${APP_VERSION}" >> $GITHUB_ENV
          fi

          # 2. استخراج ملاحظات الإصدار من update.json (باللغة العربية)
          # نستخدم EOF للسماح بحفظ الأسطر المتعددة بشكل آمن
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          python -c "
          import json, os
          if os.path.exists('update.json'):
              try:
                  with open('update.json', 'r', encoding='utf-8') as f:
                      data = json.load(f)
                      notes = data.get('stable', {}).get('release_notes', {}).get('ar', 'تحديث جديد لتطبيق IlmQuiz.')
                      print(notes)
              except Exception as e:
                  print('تحديث جديد لتطبيق IlmQuiz.')
          else:
              print('تحديث جديد لتطبيق IlmQuiz.')
          " >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Compute Artifact SHA-256 Hashes & Update update.json
        run: |
          python - << 'EOF'
          import os, glob, hashlib, json

          def get_sha256(file_path):
              h = hashlib.sha256()
              with open(file_path, "rb") as f:
                  while chunk := f.read(65536):
                      h.update(chunk)
              return f"sha256:{h.hexdigest()}"

          artifacts_dir = "artifacts"
          files = glob.glob(f"{artifacts_dir}/**/*", recursive=True)

          hash_map = {}
          for f in files:
              if os.path.isfile(f):
                  basename = os.path.basename(f)
                  file_hash = get_sha256(f)
                  print(f"Computed hash for {basename}: {file_hash}")
                  
                  if basename.endswith(".exe"):
                      hash_map["win_installed"] = (basename, file_hash)
                  elif "Windows_Portable" in basename and basename.endswith(".zip"):
                      hash_map["win_portable"] = (basename, file_hash)
                  elif basename.endswith(".dmg"):
                      hash_map["mac_installed"] = (basename, file_hash)
                  elif "macOS_Portable" in basename and basename.endswith(".zip"):
                      hash_map["mac_portable"] = (basename, file_hash)
                  elif basename.endswith(".deb"):
                      hash_map["linux_installed"] = (basename, file_hash)
                  elif "Linux_Portable" in basename and (basename.endswith(".tar.gz") or basename.endswith(".tgz")):
                      hash_map["linux_portable"] = (basename, file_hash)

          tag_name = os.environ.get("TAG_NAME", "v1.0.4")
          repo = os.environ.get("GITHUB_REPOSITORY", "MesterPerfect/IlmQuiz")
          base_url = f"https://github.com/{repo}/releases/download/{tag_name}"

          if os.path.exists("update.json"):
              with open("update.json", "r", encoding="utf-8") as f:
                  data = json.load(f)
              
              stable = data.setdefault("stable", {})
              stable["version"] = os.environ.get("APP_VERSION", "1.0.4")
              downloads = stable.setdefault("downloads", {})
              
              win = downloads.setdefault("windows", {})
              if "win_installed" in hash_map:
                  win["installed"] = f"{base_url}/{hash_map['win_installed'][0]}"
                  win["installed_hash"] = hash_map["win_installed"][1]
              if "win_portable" in hash_map:
                  win["portable"] = f"{base_url}/{hash_map['win_portable'][0]}"
                  win["portable_hash"] = hash_map["win_portable"][1]
                  
              mac = downloads.setdefault("darwin", {})
              if "mac_installed" in hash_map:
                  mac["installed"] = f"{base_url}/{hash_map['mac_installed'][0]}"
                  mac["installed_hash"] = hash_map["mac_installed"][1]
              if "mac_portable" in hash_map:
                  mac["portable"] = f"{base_url}/{hash_map['mac_portable'][0]}"
                  mac["portable_hash"] = hash_map["mac_portable"][1]
                  
              linux = downloads.setdefault("linux", {})
              if "linux_installed" in hash_map:
                  linux["installed"] = f"{base_url}/{hash_map['linux_installed'][0]}"
                  linux["installed_hash"] = hash_map["linux_installed"][1]
              if "linux_portable" in hash_map:
                  linux["portable"] = f"{base_url}/{hash_map['linux_portable'][0]}"
                  linux["portable_hash"] = hash_map["linux_portable"][1]
                  
              with open("update.json", "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)
                  f.write("\n")
              print("update.json successfully updated with actual build hashes and URLs.")
          EOF

      - name: Commit and Push Updated update.json to Master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout master
          git add update.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(updater): auto-update hashes in update.json for release ${{ env.TAG_NAME }} [skip ci]" && git push origin master)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_NOTES }}  # <--- وضعنا الملاحظات المستخرجة هنا
          files: |
            artifacts/**/*.zip
            artifacts/**/*.dmg
            artifacts/**/*.tar.gz
            artifacts/**/*.deb
            artifacts/**/*.exe
          generate_release_notes: true
